<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 60px auto;
            padding: 0 20px;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 12px;
            box-sizing: border-box;
        }

        button {
            margin-top: 12px;
            padding: 10px 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 24px;
            padding: 16px;
            border: 1px solid #ccc;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter a sentence below to detect its emotions.</p>

    <textarea id="textToAnalyze" placeholder="Example: I am very happy today!"></textarea>
    <br>
    <button type="button" onclick="analyzeEmotion()">Analyze Emotion</button>

    <div id="result"></div>

    <script>
        async function analyzeEmotion() {
            const text = document.getElementById("textToAnalyze").value;
            const result = document.getElementById("result");

            result.textContent = "Analyzing...";

            try {
                const response = await fetch(
                    "/emotionDetector?textToAnalyze=" + encodeURIComponent(text)
                );
                const output = await response.text();
                result.textContent = output;
            } catch (error) {
                result.textContent = "Unable to analyze the text. Please try again.";
            }
        }
    </script>
</body>
</html>
